            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }

            animation: blink 1s step-end infinite;

        .glitch {
            position: relative;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            clip: rect(0, 0, 0, 0);
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #f00;
            animation: glitch-anim 2s infinite linear alternate-reverse;

            left: -2px;

<body>

    <audio id="ambient" loop>
        <source src="https://assets.mixkit.co/active_preview/mp3/4462/4462.mp3" type="audio/mpeg">
    </audio>

    <div class="terminal">
        <div id="text"></div>
        <span class="cursor">_</span>
    </div>

    <div id="inputZone" style="display:none; text-align:center; margin-top:20px;">
        <span style="color:#0f0;">&gt;</span>
        <input type="text" id="commandInput" autocomplete="off" style="background:#000; border:1px solid #0f0; color:#0f0; font-family:'VT323', monospace; font-size:24px; width:60%; padding:10px;">
    </div>

    <div id="menu" style="display:none; text-align:center; margin-top:40px;">
        <div class="glitch" data-text="БИФ">БИФ</div>
        <a href="menu.html" class="btn">[ ВОЙТИ ]</a>
    </div>

    <script>
        const audio = document.getElementById('ambient');
        const screen = document.getElementById('text');
        const cursor = document.querySelector('.cursor');
        const inputZone = document.getElementById('inputZone');
        const menu = document.getElementById('menu');
        const commandInput = document.getElementById('commandInput');

        audio.volume = 0.1;
        audio.play();

        const lines = [
            "[20:48:12] // ИНИЦИАЦИЯ ПРОТОКОЛА: ДОСТУП",
            "[20:48:13] // Локация: БУНКЕР #BNC | Координаты: г. Иваново",
            "[20:48:14] // Статус систем: КРИТИЧЕСКИЙ",
            "[20:48:15] // Владелец узла: БИФ | Смотритель: СОПАФА",
            "[20:48:16] // ОШИБКА: Внешний сигнал нестабилен.",
            "[20:48:17] // Для входа введите код допуска.",
            "[20:48:18] // > "
        ];
        
        let lineIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    screen.innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 25);
                } else {
                    screen.innerHTML += "<br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 40);
                }
            } else {
                cursor.remove();
                inputZone.style.display = 'block';
                commandInput.focus();
            }
        }

        typeWriter();

        commandInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = commandInput.value.toLowerCase();
                
                if (cmd === 'bif' || cmd === 'sofa' || cmd === 'repo') {
                    document.getElementById('text').style.display = 'none';
                    inputZone.style.display = 'none';
                    menu.style.display = 'block';
                } else {
                    screen.innerHTML += "<br>// ОШИБКА: ДОСТУП ЗАКРЫТ.<br>// > ";
                    commandInput.value = "";
                }
            }
        });
    </script>
